<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-bouncer: Ghost docs assistant</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; background: #282a36; color: #f8f8f2; }
  input, button { font: inherit; padding: .6rem .8rem; border-radius: 6px; border: 1px solid #6272a4; }
  input { width: 70%; background: #44475a; color: #f8f8f2; }
  button { background: #bd93f9; color: #282a36; border: 0; cursor: pointer; }
  #answer { margin-top: 1.5rem; white-space: pre-wrap; }
  #sources a { color: #8be9fd; display: block; font-size: .85rem; }
</style>
</head>
<body>
<h1>Ask the Ghost docs</h1>
<form id="ask-form">
  <label for="question">Question</label><br>
  <input id="question" name="question" placeholder="Which database does Ghost support?" required>
  <button type="submit">Ask</button>
</form>
<div id="answer" role="status" data-testid="answer"></div>
<div id="sources" data-testid="sources"></div>
<script>
document.getElementById('ask-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const answer = document.getElementById('answer');
  const sources = document.getElementById('sources');
  answer.textContent = 'Thinking...';
  sources.innerHTML = '';
  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: document.getElementById('question').value }),
  });
  const data = await res.json();
  answer.textContent = data.answer;
  for (const url of data.sources) {
    const a = document.createElement('a');
    a.href = url; a.textContent = url.split('/').pop(); sources.appendChild(a);
  }
});
</script>
</body>
</html>
